<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Emotion & Adaptive Dialogue Settings</title>
  <link rel="stylesheet" href="../../web/style.css">
  <style>
    body { padding: 24px; max-width: 600px; margin: 0 auto; background: #0B1120; }
    .tauri-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px; }
  </style>
</head>
<body>
  <div class="tauri-card">
    <div class="card-header">
      <h2>JARVIS Emotion Settings</h2>
      <span class="badge" id="emotion-status-badge">Active</span>
    </div>

    <div class="emotion-controls-grid">
      <div class="toggle-group">
        <label class="switch-label">
          <span>Emotion Understanding</span>
          <input type="checkbox" id="toggle-emotion-enabled" checked>
          <span class="slider round"></span>
        </label>
        <label class="switch-label">
          <span>Neutral Mode</span>
          <input type="checkbox" id="toggle-neutral-mode">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="emotion-meters" id="emotion-meters-container">
        <div class="meter-row">
          <span class="meter-label">Valence</span>
          <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="meter-valence" style="width: 50%;"></div>
          </div>
          <span class="meter-num" id="val-valence">0.00</span>
        </div>
        <div class="meter-row">
          <span class="meter-label">Arousal</span>
          <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="meter-arousal" style="width: 10%;"></div>
          </div>
          <span class="meter-num" id="val-arousal">0.10</span>
        </div>
        <div class="meter-row">
          <span class="meter-label">Dominance</span>
          <div class="meter-bar-bg">
            <div class="meter-bar-fill" id="meter-dominance" style="width: 50%;"></div>
          </div>
          <span class="meter-num" id="val-dominance">0.50</span>
        </div>
      </div>

      <div class="adaptation-badges">
        <span class="adaptive-pill" id="badge-tone">Tone: balanced</span>
        <span class="adaptive-pill" id="badge-challenge">Challenge: standard</span>
        <span class="adaptive-pill" id="badge-step">Steps: normal</span>
      </div>

      <div class="emotion-actions" style="margin-top: 10px;">
        <button class="danger-btn" id="btn-clear-emotion">Clear Emotion History</button>
      </div>
    </div>
  </div>

  <script src="../../web/app.js"></script>
</body>
</html>
